bio: |
  - Investigador del Instituto Nacional de Salud Pública (INSP)
  - Profesor de programas de posgrado en la Escuela de Salud Pública de México (ESPM).
  - Investigador Nacional Nivel-II del Sistema Nacional de Investigadoras e Investigadores (SECIHTI).
  - Investigador principal y co-investigador de diversos proyectos relacionados con la
  contaminación ambiental y sus riesgos para la salud humana.

  ## {{< icon name="hero/briefcase" >}} Líneas de trabajo
  - Contaminación del aire y sus impactos en salud.
  - Análisis espacial de los riesgos a la salud asociados a la exposición a 
  contaminantes ambientales.
  - Estadística espacial y epidemiología espacial.
  - Desarrollo y aplicación de métodos para estimar la exposición humana a 
  contaminantes ambientales utilizando el software R

